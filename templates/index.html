<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Cowboy</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #88aacc;
        font-family: 'Courier New', monospace;
        font-size: 13px;
        pointer-events: none;
        user-select: none;
        line-height: 1.6;
      }
      #hud .key {
        color: #556677;
      }
      #controls {
        position: absolute;
        bottom: 12px;
        left: 12px;
        color: #445566;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
        line-height: 1.8;
      }

      /* ── Colony Panel ──────────────────────────────────────────────────── */
      #colony-panel {
        display: none;
        position: absolute;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        background: rgba(6, 12, 22, 0.96);
        border: 1px solid rgba(80, 120, 180, 0.5);
        border-radius: 6px;
        padding: 16px 18px;
        color: #88aacc;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        width: 300px;
        max-height: 90vh;
        overflow-y: auto;
        z-index: 100;
      }
      .cp-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 2px;
      }
      #colony-panel-title {
        color: #aaccee;
        font-size: 13px;
        font-weight: bold;
      }
      #colony-panel-close-btn {
        background: none;
        border: none;
        color: #445566;
        font-size: 14px;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
      }
      #colony-panel-close-btn:hover { color: #aaccee; }
      #colony-panel-subtitle {
        color: #445566;
        font-size: 10px;
        margin-bottom: 10px;
      }
      .cp-divider {
        border: none;
        border-top: 1px solid rgba(80, 120, 180, 0.2);
        margin: 10px 0;
      }
      .cp-section-label {
        color: #445566;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }
      /* Size + growth */
      .cp-size-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .cp-size-name { color: #88aacc; }
      .cp-progress-bar {
        flex: 1;
        height: 4px;
        background: rgba(80, 120, 180, 0.2);
        border-radius: 2px;
        overflow: hidden;
      }
      .cp-progress-fill {
        height: 100%;
        background: #44cc88;
        border-radius: 2px;
        transition: width 0.3s;
      }
      .cp-progress-label { color: #445566; font-size: 10px; }
      /* Dev level */
      .cp-dev-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .cp-dev-name { color: #88aacc; }
      #colony-panel-upgrade-btn {
        background: rgba(40, 80, 60, 0.7);
        border: 1px solid rgba(60, 160, 100, 0.5);
        color: #66cc88;
        font-family: 'Courier New', monospace;
        font-size: 10px;
        padding: 3px 8px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
      }
      #colony-panel-upgrade-btn:hover { background: rgba(60, 110, 80, 0.8); }
      #colony-panel-upgrade-btn:disabled {
        color: #445566;
        border-color: rgba(40, 70, 60, 0.3);
        cursor: default;
      }
      .cp-upgrade-cost {
        color: #445566;
        font-size: 10px;
        margin-bottom: 2px;
        padding-left: 2px;
      }
      /* Resource flow table */
      .cp-flows-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }
      .cp-flows-table th {
        color: #445566;
        font-weight: normal;
        text-align: right;
        padding: 0 4px 4px 0;
      }
      .cp-flows-table th:first-child { text-align: left; }
      .cp-flows-table td {
        text-align: right;
        padding: 1px 4px 1px 0;
        color: #88aacc;
      }
      .cp-flows-table td:first-child { text-align: left; color: #667788; }
      .net-pos { color: #44cc88; }
      .net-neg { color: #cc4444; }
      .net-zero { color: #445566; }
      /* Stockpiles */
      .cp-stockpile-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 12px;
        font-size: 10px;
      }
      .cp-stockpile-entry {
        display: flex;
        justify-content: space-between;
      }
      .cp-stockpile-label { color: #556677; }
      .cp-stockpile-value { color: #88aacc; }
      /* Found colony button */
      #colony-panel-found {
        width: 100%;
        margin-top: 10px;
        background: rgba(40, 70, 110, 0.7);
        border: 1px solid rgba(60, 160, 100, 0.5);
        color: #66cc88;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        padding: 6px 12px;
        border-radius: 3px;
        cursor: pointer;
      }
      #colony-panel-found:hover { background: rgba(60, 100, 80, 0.8); }
      #colony-panel-found:disabled {
        color: #445566;
        border-color: rgba(40, 70, 60, 0.3);
        cursor: default;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div><span class="key">pos</span> <span id="hud-pos">0, 0 Ly</span></div>
      <div><span class="key">zoom</span> <span id="hud-zoom">1.00</span></div>
      <div><span class="key">stars</span> <span id="hud-stars">0</span></div>
      <div><span class="key">chunks</span> <span id="hud-chunks">0</span></div>
      <div><span class="key">seed</span> <span id="hud-seed">42</span></div>
    </div>
    <div id="controls">
      <div>drag — pan camera</div>
      <div>scroll — zoom</div>
      <div>click — move ship / planet</div>
      <div>D — debug overlay</div>
      <div>R — reset camera</div>
    </div>

    <div id="colony-panel">
      <div class="cp-header">
        <div id="colony-panel-title">Planet Name</div>
        <button id="colony-panel-close-btn">✕</button>
      </div>
      <div id="colony-panel-subtitle"></div>

      <!-- Colony status badge (homeworld / colony / none) -->
      <div id="colony-panel-status"></div>

      <!-- Size + growth (only shown for colonies) -->
      <div id="colony-panel-colony-section" style="display:none">
        <hr class="cp-divider">
        <div class="cp-section-label">Colony Status</div>

        <div class="cp-size-row">
          <span class="cp-size-name" id="cp-size-name">Settlement</span>
          <div class="cp-progress-bar">
            <div class="cp-progress-fill" id="cp-growth-fill" style="width:0%"></div>
          </div>
          <span class="cp-progress-label" id="cp-growth-label">0/10</span>
          <span class="cp-progress-label" id="cp-next-size"></span>
        </div>

        <div class="cp-dev-row">
          <span class="cp-dev-name" id="cp-dev-name">Primitive</span>
          <button id="colony-panel-upgrade-btn" disabled>Upgrade</button>
        </div>
        <div class="cp-upgrade-cost" id="cp-upgrade-cost"></div>

        <hr class="cp-divider">
        <div class="cp-section-label">Resource Flows <span style="color:#334455">(per tick)</span></div>
        <table class="cp-flows-table">
          <thead>
            <tr>
              <th></th>
              <th>extract</th>
              <th>consume</th>
              <th>net</th>
            </tr>
          </thead>
          <tbody id="cp-flows-body"></tbody>
        </table>

        <hr class="cp-divider">
        <div class="cp-section-label">Stockpiles</div>
        <div class="cp-stockpile-grid" id="cp-stockpiles"></div>
      </div>

      <!-- Potential yields (shown for non-colony planets) -->
      <div id="colony-panel-yields-section" style="display:none">
        <hr class="cp-divider">
        <div class="cp-section-label">Potential Yields</div>
        <div id="colony-panel-yields"></div>
      </div>

      <button id="colony-panel-found" style="display:none">Found Colony</button>
    </div>

    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
